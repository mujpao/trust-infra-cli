[package]
name = "trust-infra-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
hex = "0.4"
rand = "0.10"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
