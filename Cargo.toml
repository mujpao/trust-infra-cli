[package]
name = "trust-infra-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
hex = "0.4"
rand = "0.10"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
